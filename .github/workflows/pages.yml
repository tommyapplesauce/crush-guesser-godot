name: Deploy Godot web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify and unpack repaired standalone browser build
        run: |
          cat crush-mockup-fidelity-20261013-r1.zip.part01 crush-mockup-fidelity-20261013-r1.zip.part02 crush-mockup-fidelity-20261013-r1.zip.part03 > web.zip
          echo 'f38a60a7b9fdbf0990ecdba4e3f97eae2629dcff6ff0a373b30a66230c7e329e  web.zip' | sha256sum --check --strict
          mkdir -p _site
          unzip -q web.zip -d _site
          test -s _site/index.html
          test -s _site/crush-mockup-fidelity-20261013-r1.wasm
          test -s _site/crush-mockup-fidelity-20261013-r1.pck
          grep -qx 'crush-mockup-fidelity-20261013-r1' _site/build-version.txt
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
