name: Deploy Godot web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify and restore last working browser build
        run: |
          echo '668afb9b7b68a52d7d1e7af7eca4261cd1e9104f993e2a8fcf940753eea34af8  Crush_Guesser_95_Web_Test_Build.zip' | sha256sum --check --strict
          mkdir -p _site
          unzip -q Crush_Guesser_95_Web_Test_Build.zip -d _site
          test -s _site/index.html
          test -s _site/index.wasm
          test -s _site/index.pck
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
