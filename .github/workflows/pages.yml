name: Deploy Godot web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify and unpack repaired standalone browser build
        run: |
          cat Crush_Guesser_95_Tactile_Web.zip.part01 Crush_Guesser_95_Tactile_Web.zip.part02 Crush_Guesser_95_Tactile_Web.zip.part03 > web.zip
          echo '46ed508688dace0ea371df1af2da3154d1d1fb2bac6269dc1604cb8db2f3659c  web.zip' | sha256sum --check --strict
          mkdir -p _site
          unzip -q web.zip -d _site
          test -s _site/index.html
          test -s _site/crush-tactile-suno-fix1-20261013.wasm
          test -s _site/crush-tactile-suno-fix1-20261013.pck
          grep -qx 'crush-tactile-suno-fix1-20261013' _site/build-version.txt
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
